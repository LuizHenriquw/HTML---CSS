<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Profissões</H1>
    <form action="" method="post" autocomplete="on">
        <p>
            <label for="Prof">Profissões</label>
            <select name="Prof" id="Prof">
                <option value="medico">Médico</option>
                <option value="engenheiro">Engenheiro</option>
                <option value="advogado">Advogado</option>
                <option value="professor">Professor</option>
                <option value="programador">Programador</option>
                <option value="tecnico">Técnico</option>
                <option value="veterinario">Veterinário</option>
                <option value="enfermeiro">Enfermeiro</option>
                <option value="dentista">Dentista</option>
                <option value="arquiteto">Arquiteto</option>
                <option value="contador">Contador</option>
                <option value="jornalista">Jornalista</option>
            </select>
        </p>
        <h1>Estados</h1>
        <p>
            <label for="estados">estados</label>
            <input list="estados" name="estado" id="estado">
            <datalist id="estados">
                <option value="Acre">
                <option value="Alagoas">
                <option value="Amapá">
                <option value="Amazonas">
                <option value="Bahia">
                <option value="Ceará">
                <option value="Distrito Federal">
                <option value="Espírito Santo">
                <option value="Goiás">
                <option value="Maranhão">
                <option value="Mato Grosso">
        </p>
        
        <br><p>
            <label for="nome">Usuario</label>
            <input type="text" name="nome" id="nome" autocomplete="username"
            placeholder="Digite seu nome"  minlength="5" maxlength="12" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
           

</body>
</html>
